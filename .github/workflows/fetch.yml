name: fetch-assets
on:
  push:
    paths: ['fetch/list.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed assets
        run: |
          mkdir -p fetch/out
          while read -r url name; do
            [ -z "$url" ] && continue
            curl -sSL --retry 3 -o "fetch/out/$name" "$url"
            ls -la "fetch/out/$name"
          done < fetch/list.txt
      - name: Commit
        run: |
          git config user.name "asset-bot"; git config user.email "actions@users.noreply.github.com"
          git add fetch/out && git commit -m "Fetched assets" && git push
