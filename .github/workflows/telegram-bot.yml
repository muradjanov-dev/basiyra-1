name: Telegram translator bot

# Bot GitHub Actions ichida long polling bilan ishlaydi.
# Bitta job ko'pi bilan 6 soat yashaydi, shuning uchun har 5 soatda yangi
# run boshlanadi va eskisini bekor qiladi (bir vaqtda faqat bitta nusxa).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main, claude/telegram-translator-bot-e1cbo4]
    paths:
      - "telegram-bot/**"
      - ".github/workflows/telegram-bot.yml"

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        # 5 soat 50 daqiqadan keyin o'zi to'xtaydi; 124 = timeout, xato emas
        run: timeout 350m python bot.py || [ $? -eq 124 ]
